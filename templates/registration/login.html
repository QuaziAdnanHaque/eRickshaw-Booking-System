<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - eRickshaw Booking</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
      <!-- Header -->
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold">Login</h1>
        <p class="text-gray-500 text-sm">Access your e-Rickshaw account</p>
      </div>

      <!-- Error -->
      {% if form.errors %}
      <div class="bg-red-100 text-red-600 p-3 rounded mb-4 text-sm">
        Invalid username or password
      </div>
      {% endif %}

      <!-- Form -->
      <form method="post">
        {% csrf_token %}

        <!-- Username -->
        <div class="mb-4">
          <label class="block font-semibold">Username</label>
          <input
            type="text"
            name="username"
            value="{{ form.username.value|default:'' }}"
            class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500"
            placeholder="Enter username"
          />
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label class="block font-semibold">Password</label>
          <input
            type="password"
            name="password"
            class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500"
            placeholder="••••••••"
          />
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:opacity-90"
        >
          Login
        </button>
      </form>

      <!-- Register link -->
      <div class="text-center mt-4 text-sm">
        Don’t have an account?
        <a href="{% url 'accounts:register' %}" class="text-green-600 font-semibold">
          Register
        </a>
      </div>
    </div>
  </body>
</html>
